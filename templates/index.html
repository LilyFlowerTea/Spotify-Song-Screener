<!DOCTYPE html>
<html>
<head>
    <title>Spotify Recommender</title>
</head>

<body>
    <h1>Spotify Song Recommender</h1>
<!--    create submission field -->
    <form action = "/data_request" method = "post">
        <p>Please enter your target song URL below:</p>
        <input id = "target_song_url" type = "text" name = "target_song_url">
        <p>Please enter the full URL of your comparison object (playlist/album, artist) below:</p>
        <input id = "comparison_url" type = "text" name = "comparison_url">
        <p>Please type either playlist or artist below:</p>
        <input id = "method" type = "text" name = "playlist_url">
        <button id = "data_submission" type = "button">Submit</button>
    </form>

    <p id = "target_song_output">Target song URL appears here</p>
    <p id = "comparison_output">Playlist URL appears here</p>
    <div id = "distance_table">Distance Table:</div>
    <br>
    <div id = "sorted_table">Sorted Distance Table:</div>

<script src="{{ url_for('static', path='script.js') }}"></script>

</body>
</html>
